seed: 42

models:
    separate: True
    policy:
        class: GaussianMixin
        clip_actions: True
        clip_log_std: True
        min_log_std: -5
        max_log_std: 0.5
        initial_log_std: 0.0
        network:
            -   name: net
                input: STATES
                layers: [512, 512]
                activation: tanh
        output: ACTIONS
    critic_1:
        class: DeterministicMixin
        clip_actions: False
        network:
            -   name: net
                input: concatenate([STATES, ACTIONS])
                layers: [512,512]
                activation: tanh
        output: ONE
    critic_2:
        class: DeterministicMixin
        clip_actions: False
        network:
            -   name: net
                input: concatenate([STATES, ACTIONS])
                layers: [512, 512]
                activation: tanh
        output: ONE
    target_critic_1:
        class: DeterministicMixin
        clip_actions: False
        network:
            -   name: net
                input: concatenate([STATES, ACTIONS])
                layers: [512, 512]
                activation: tanh
        output: ONE
    target_critic_2:
        class: DeterministicMixin
        clip_actions: False
        network:
            -   name: net
                input: concatenate([STATES, ACTIONS])
                layers: [512, 512]
                activation: tanh
        output: ONE

memory:
    class: RandomMemory
    memory_size: 10000

agent:
    class: SAC
    rollouts: 64
    gradient_steps: 2            # gradient steps
    batch_size: 256               # training batch size
    discount_factor: 0.95        # discount factor (gamma)
    polyak: 0.005                # soft update hyperparameter (tau)
    actor_learning_rate: 1.0e-4    # actor learning rate
    critic_learning_rate: 1.0e-4   # critic learning rate
    learning_rate_scheduler: None      # learning rate scheduler class (see torch.optim.lr_scheduler)
    learning_rate_scheduler_kwargs: None   # learning rate scheduler's kwargs (e.g. {"step_size": 1e-3})
        # kl_threshold: 0.008
    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null

    random_timesteps: 0          # random exploration steps
    learning_starts: 10           # learning starts after this many steps
    grad_norm_clip: 0.0            # clipping coefficient for the norm of the gradients

    learn_entropy: True          # learn entropy
    entropy_learning_rate: 1.0e-2  # entropy learning rate
    initial_entropy_value: 0.02   # initial entropy value
    target_entropy: null         # target entropy
    rewards_shaper_scale: 0.1         # rewards shaping function: Callable(reward, timestep, timesteps) -> reward
    mixed_precision: True       # enable automatic mixed precision for higher performance
    experiment:
        directory: SAC            # experiment's parent directory
        experiment_name: ""      # experiment name
        write_interval: auto   # TensorBoard writing interval (timesteps)
        checkpoint_interval: auto      # interval for checkpoints (timesteps)

trainer:
    class: SequentialTrainer
    timesteps: 40000
    environment_info: log
